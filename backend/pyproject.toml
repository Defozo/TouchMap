[project]
name = "touchmap-preparation"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115", "uvicorn>=0.34", "pydantic>=2.10", "pillow>=11", "defusedxml>=0.7", "svgpathtools>=1.6", "shapely>=2", "httpx>=0.28", "google-genai>=1", "python-multipart>=0.0.20", "mutagen>=1.47", "resvg-py==0.5.0"]

[project.scripts]
touchmap = "touchmap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["touchmap"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
