<svg xmlns="http://www.w3.org/2000/svg" width="640" height="440" viewBox="0 0 640 440">
<title>Reading a rainfall chart</title>
<desc>A simple bar chart. The horizontal axis shows April, May and June. The vertical axis shows rainfall in millimetres on a linear scale from zero to sixty. April has twenty millimetres, May forty, and June is unknown.</desc>
<rect width="640" height="440" fill="#f4f5ef"/>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#24544c"/></marker></defs>
<text x="32" y="35" font-size="23" fill="#183b34">Reading a rainfall chart</text>
<path d="M75 80 V360 H570" fill="none" stroke="#183b34" stroke-width="2"/>
<text x="40" y="365" font-size="16">0</text><path d="M75 360 H570" stroke="#d1d8d3" fill="none"/>
<text x="40" y="285" font-size="16">20</text><path d="M75 280 H570" stroke="#d1d8d3" fill="none"/>
<text x="40" y="205" font-size="16">40</text><path d="M75 200 H570" stroke="#d1d8d3" fill="none"/>
<text x="40" y="125" font-size="16">60</text><path d="M75 120 H570" stroke="#d1d8d3" fill="none"/>
<text x="35" y="67" font-size="16">mm</text><text x="275" y="420" font-size="16">Month</text>
<polygon id="april" points="105,280 210,280 210,360 105,360" fill="#d7e9c7" stroke="#24544c" stroke-width="2"><title>April: 20 millimetres</title><desc>Recorded rainfall is 20 millimetres.</desc></polygon>
<text id="april-value" x="157.5" y="268" text-anchor="middle" font-size="19">20</text><text x="157.5" y="390" text-anchor="middle" font-size="18">April</text>
<polygon id="may" points="265,200 370,200 370,360 265,360" fill="#d7e9c7" stroke="#24544c" stroke-width="2"><title>May: 40 millimetres</title><desc>Recorded rainfall is 40 millimetres.</desc></polygon>
<text id="may-value" x="317.5" y="188" text-anchor="middle" font-size="19">40</text><text x="317.5" y="390" text-anchor="middle" font-size="18">May</text>
<polygon id="june" points="425,350 530,350 530,360 425,360" fill="#d7e9c7" stroke="#24544c" stroke-width="2"><title>June: unknown</title><desc>June rainfall was not recorded. It is unknown, not zero.</desc></polygon>
<text id="june-value" x="477.5" y="338" text-anchor="middle" font-size="19">Unknown</text><text x="477.5" y="390" text-anchor="middle" font-size="18">June</text>
</svg>
